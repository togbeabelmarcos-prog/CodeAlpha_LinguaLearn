{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="ll-card">
        <h1 style="font-size:1.4rem;">Mot de passe oublié</h1>
        <p class="text-muted-ll">Saisissez votre email, nous vous enverrons un lien de réinitialisation (affiché dans la console du serveur en mode développement).</p>
        <form method="post">
            {% csrf_token %}
            <input class="ll-input" type="email" name="email" required placeholder="Email">
            <button class="ll-btn ll-btn-block" type="submit">Envoyer</button>
        </form>
    </div>
</div>
{% endblock %}
