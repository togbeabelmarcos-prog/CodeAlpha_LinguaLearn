{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="ll-card">
        <h1 style="font-size:1.3rem;">Nouveau mot de passe</h1>
        {% if validlink %}
        <form method="post">
            {% csrf_token %}
            <input class="ll-input" type="password" name="new_password1" placeholder="Nouveau mot de passe" required>
            <input class="ll-input" type="password" name="new_password2" placeholder="Confirmer" required>
            <button class="ll-btn ll-btn-block" type="submit">Réinitialiser</button>
        </form>
        {% else %}
        <p>Ce lien de réinitialisation n'est plus valide.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
